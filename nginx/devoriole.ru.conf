# Nginx Virtual Host Configuration for devoriole.ru
# Place in: /etc/nginx/sites-available/devoriole.ru
# Symlink to: /etc/nginx/sites-enabled/devoriole.ru

# 1. HTTP to HTTPS Automatic Redirect
server {
    listen 80;
    listen [::]:80;
    server_name devoriole.ru www.devoriole.ru;

    # Certbot challenge location for SSL certificate renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name devoriole.ru www.devoriole.ru;

    # SSL Certificates (Managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/devoriole.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devoriole.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Optimization Security Headers & Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    
    client_max_body_size 50M;

    # Proxy to FastAPI App Running in Docker on Port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket & Connection Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Long Simulations
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
