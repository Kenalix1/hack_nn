name: cosmo-hack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmo_hack_app
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/scenarios')"]
      interval: 10s
      timeout: 5s
      retries: 3
