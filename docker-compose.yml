name: cosmo-hack

services:
  db:
    image: postgres:15-alpine
    container_name: cosmo_hack_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cosmohack
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmo_hack_app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/cosmohack
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./frontend/dist:/app/frontend/dist
      - ./data:/app/data
      - ./cosmohack.db:/app/cosmohack.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/scenarios')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
